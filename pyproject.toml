[project]
name = "irg-utils"
version = "2.0.0"
description = "Utilidades de uso compartido entre proyectos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PERF", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = [
    "--doctest-modules",
    "--cov=irg_utils",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pre-commit>=4.3.0",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
